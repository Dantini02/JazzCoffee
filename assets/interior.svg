<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Interior de JazzCoffe</title>
  <desc id="desc">Ilustración de una cafetería con ambiente de jazz: mesas redondas, un pequeño escenario con contrabajo y luces cálidas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241E17"/>
      <stop offset="100%" stop-color="#15110D"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#C9973B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9973B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#spot)"/>

  <!-- Pared con marco de ventana -->
  <rect x="40" y="60" width="200" height="140" fill="#2E2620" stroke="#C9973B" stroke-width="3"/>
  <line x1="140" y1="60" x2="140" y2="200" stroke="#C9973B" stroke-width="2"/>
  <line x1="40" y1="130" x2="240" y2="130" stroke="#C9973B" stroke-width="2"/>
  <rect x="46" y="66" width="88" height="58" fill="#3B2F22"/>
  <rect x="146" y="66" width="88" height="58" fill="#4A3A28"/>
  <rect x="46" y="136" width="88" height="58" fill="#4A3A28"/>
  <rect x="146" y="136" width="88" height="58" fill="#3B2F22"/>

  <!-- Escenario pequeño -->
  <rect x="520" y="230" width="220" height="18" fill="#7A2E2E"/>
  <!-- Contrabajo estilizado -->
  <ellipse cx="640" cy="200" rx="26" ry="42" fill="#8A5A2B"/>
  <ellipse cx="640" cy="165" rx="16" ry="20" fill="#8A5A2B"/>
  <line x1="640" y1="120" x2="640" y2="230" stroke="#4A3220" stroke-width="4"/>
  <circle cx="640" cy="230" r="4" fill="#1B1712"/>

  <!-- Micrófono -->
  <line x1="560" y1="250" x2="560" y2="190" stroke="#C9973B" stroke-width="3"/>
  <circle cx="560" cy="182" r="9" fill="#C9973B"/>

  <!-- Mesas redondas con tazas -->
  <g>
    <ellipse cx="180" cy="400" rx="70" ry="18" fill="#3B2F22"/>
    <rect x="172" y="380" width="16" height="20" fill="#2A2016"/>
    <circle cx="180" cy="378" r="55" fill="none" stroke="#C9973B" stroke-width="2" opacity="0.25"/>
    <circle cx="160" cy="392" r="10" fill="#EDE3CF"/>
    <circle cx="200" cy="396" r="10" fill="#EDE3CF"/>
  </g>
  <g>
    <ellipse cx="400" cy="430" rx="70" ry="18" fill="#3B2F22"/>
    <rect x="392" y="410" width="16" height="20" fill="#2A2016"/>
    <circle cx="380" cy="422" r="10" fill="#EDE3CF"/>
    <circle cx="420" cy="426" r="10" fill="#EDE3CF"/>
  </g>

  <!-- Disco de vinilo colgante -->
  <circle cx="700" cy="90" r="34" fill="#15110D" stroke="#C9973B" stroke-width="2"/>
  <circle cx="700" cy="90" r="6" fill="#C9973B"/>
  <line x1="700" y1="0" x2="700" y2="56" stroke="#C9973B" stroke-width="1.5"/>

  <!-- Notas musicales flotando -->
  <g fill="#C9973B">
    <text x="300" y="120" font-size="28" font-family="serif">♪</text>
    <text x="340" y="90" font-size="22" font-family="serif">♫</text>
    <text x="460" y="140" font-size="26" font-family="serif">♪</text>
  </g>
</svg>
